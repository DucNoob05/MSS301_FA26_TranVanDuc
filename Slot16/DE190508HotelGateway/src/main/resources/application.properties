spring.application.name=DE190508HotelGateway
server.port=8080

# -- Routes --
# Room Service
spring.cloud.gateway.routes[0].id=room-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/rooms/**

# Reservation Service
spring.cloud.gateway.routes[1].id=reservation-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reservations/**

# Spring Cloud Gateway WebFlux format compatibility
spring.cloud.gateway.server.webflux.routes[0].id=room-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/rooms/**
spring.cloud.gateway.server.webflux.routes[1].id=reservation-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reservations/**

# -- Swagger / SpringDoc --
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Aggregate the downstream service docs in the gateway Swagger UI
springdoc.swagger-ui.urls[0].name=room-service
springdoc.swagger-ui.urls[0].url=http://localhost:8081/v3/api-docs
springdoc.swagger-ui.urls[1].name=reservation-service
springdoc.swagger-ui.urls[1].url=http://localhost:8082/v3/api-docs

# CORS is configured in CorsConfig.java via CorsWebFilter
